{% extends "blog/base.html" %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">
      Видео по тегу: <span class="badge" style="background-color: {{ tag.color }}; font-size: 0.8em;">{{ tag.name }}</span>
    </h1>
    <a href="{% url 'tag_library' %}" class="btn btn-outline-secondary">← Ко всем тегам</a>
  </div>

  <!-- Панель фильтров (Фильмы/Уроки) -->
  <div class="mb-4">
    <a href="{% url 'videos_by_tag' tag.slug %}" class="btn {% if not current_type_filter %}btn-primary{% else %}btn-outline-primary{% endif %}">Все</a>
    <a href="?type=MOVIE" class="btn {% if current_type_filter == 'MOVIE' %}btn-primary{% else %}btn-outline-primary{% endif %}">🎬 Только фильмы</a>
    <a href="?type=LESSON" class="btn {% if current_type_filter == 'LESSON' %}btn-primary{% else %}btn-outline-primary{% endif %}">🎓 Только уроки</a>
  </div>

  {% include 'blog/partials/video_grid.html' with movies=videos %}

{% endblock %}
