<!DOCTYPE html>

    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #252532;
            --text-main: #ffffff;
            --text-muted: #8b8b9b;
            --accent-color: #3b82f6;
            --divider: #323242;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 500px;
            width: 100%;
        }

        .category {
            margin-bottom: 40px;
        }

        .category-header {
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .category-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .category-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .habit-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 5px 20px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--divider);
        }

        .habit-item:last-child {
            border-bottom: none;
        }

        .icon-box {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .text-content {
            flex-grow: 1;
            padding-right: 15px;
        }

        .habit-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .habit-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .checkbox-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .checkbox-wrapper input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: transparent;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .checkbox-wrapper input:checked ~ .checkmark {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 8px;
            top: 4px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-wrapper input:checked ~ .checkmark:after {
            display: block;
        }
    </style>
</head>
