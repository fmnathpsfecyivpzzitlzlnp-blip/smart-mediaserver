{% extends 'blog/base.html' %}
{% block title %}Добавить ребенка{% endblock %}

{% block extra_head %}
<style>
    .kids-app-wrapper {
        --bg-light-blue: #e8f0fe;
        --header-blue: #8b9dff;
        --text-main: #2c3e50;
        --input-bg: #dce5fa;
        --btn-purple: #8b9dff;
        --white: #ffffff;
        
        background-color: var(--bg-light-blue);
        color: var(--text-main);
        max-width: 500px;
        margin: 0 auto;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        padding-bottom: 30px;
        min-height: 500px;
    }

    .kids-app-wrapper .page-header { display: flex; align-items: center; padding: 20px; font-size: 24px; font-weight: 700; background-color: var(--header-blue); color: var(--text-main);}
    .kids-app-wrapper .back-btn { margin-right: 15px; font-size: 24px; cursor: pointer; text-decoration: none; color: var(--text-main); }

    .kids-app-wrapper .form-container { padding: 30px 20px 0; display: flex; flex-direction: column; }
    .kids-app-wrapper .form-label { font-size: 16px; margin-bottom: 8px; font-weight: bold; }
    
    .kids-app-wrapper .input-box { background-color: var(--input-bg); border-radius: 12px; padding: 15px; margin-bottom: 25px; font-size: 16px; border: none; width: 100%; color: var(--text-main); font-weight: bold;}
    .kids-app-wrapper .input-box:focus { outline: none; box-shadow: 0 0 0 2px var(--btn-purple); }

    .kids-app-wrapper .save-btn { background-color: var(--btn-purple); color: var(--white); text-align: center; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; border: none; width: 100%; box-shadow: 0 4px 10px rgba(139, 157, 255, 0.4); margin-top: 20px;}
    .kids-app-wrapper .save-btn:hover { filter: brightness(0.95); transform: translateY(-2px); }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="kids-app-wrapper">

        <div class="page-header">
            <a href="{% url 'parent_dashboard' %}" class="back-btn">‹</a>
            <div>Добавить аккаунт</div>
        </div>

        <div class="form-container">
            <p style="margin-bottom: 25px; font-size: 14px; color: #5f6368;">
                Этот аккаунт будет использоваться ребенком для входа в систему, выполнения заданий и покупок в магазине.
            </p>

            <label class="form-label">Имя ребенка (Как отображать на экране):</label>
            <input type="text" id="childFirstName" class="input-box" placeholder="Например: Лиза">

            <label class="form-label">Логин (Для входа в систему):</label>
            <input type="text" id="childUsername" class="input-box" placeholder="Например: liza2026">

            <label class="form-label">Пароль для входа:</label>
            <input type="password" id="childPassword" class="input-box" placeholder="Придумайте простой пароль">

            <button class="save-btn" onclick="registerChild(this)">Создать аккаунт</button>

        </div>
    </div>
</div>

<script>
    async function registerChild(btn) {
        const firstName = document.getElementById('childFirstName').value.trim();
        const username = document.getElementById('childUsername').value.trim();
        const password = document.getElementById('childPassword').value.trim();

        if(!firstName || !username || !password) { alert('Пожалуйста, заполните все поля!'); return; }

        btn.innerText = "Создаю...";
        btn.disabled = true;

        try {
            const res = await fetch("{% url 'add_child_api' %}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
                body: JSON.stringify({username: username, password: password, first_name: firstName})
            });
            const data = await res.json();

            if(data.status === 'ok') {
                alert('Ура! Аккаунт для ' + firstName + ' успешно создан!');
                window.location.href = "{% url 'parent_dashboard' %}";
            } else {
                alert('Ошибка: ' + data.message);
                btn.innerText = "Создать аккаунт";
                btn.disabled = false;
            }
        } catch(e) {
            alert("Сетевая ошибка");
            btn.innerText = "Создать аккаунт";
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
